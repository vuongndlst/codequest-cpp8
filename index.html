    <meta

    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="vi_VN" />
    <meta property="og:title" content="CodeQuest C++ 8 — Hành trình giải cứu ByteLand" />
    <meta
      property="og:description"
      content="Viết C++ thật, thấy thế giới thay đổi ngay. Khóa học dạng game với phản hồi và gợi ý hoàn toàn bằng tiếng Việt."

    <!-- Font: Be Vietnam Pro (giao diện) + JetBrains Mono (code) — Google Fonts, giấy phép SIL OFL 1.1 -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <title>CodeQuest C++ 8 — Hành trình giải cứu ByteLand</title>

    <!--
      Đặt giao diện TRƯỚC khi trình duyệt vẽ khung hình đầu tiên.

      Nếu để React làm việc này thì trang luôn chớp một nhịp màu tối rồi mới
      chuyển sang màu sáng — trên máy phòng ICT chạy chậm, cú chớp đó kéo dài
      nửa giây và nhìn như website bị lỗi.

      Đoạn script cố ý viết thẳng ở đây, không tách file: nó phải chạy đồng bộ
      và xong trước mọi thứ khác. Khoá lưu trữ phải khớp `src/utils/theme.ts`.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('cq8:theme');
          var theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.dataset.theme = theme;
        } catch (error) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Website này cần JavaScript để hoạt động. Em hãy bật JavaScript trong trình duyệt nhé.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
